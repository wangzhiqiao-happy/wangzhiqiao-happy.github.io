<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>重设拾词密码</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:24px;background:#f5effb;color:#302044;font:16px/1.6 system-ui,sans-serif}main{max-width:420px;margin:8vh auto;background:white;padding:24px;border-radius:22px}h1{margin:0;font-size:26px}form{display:grid;gap:12px}form[hidden]{display:none}label{font-weight:650}.field{display:flex;border:1px solid #cbb8dd;border-radius:12px;overflow:hidden}input{width:100%;min-width:0;padding:12px;border:0;font:inherit}button{font:inherit;cursor:pointer}.eye{min-width:44px;min-height:44px;background:white;border:0;color:#583778}.eye svg{width:22px;height:22px;vertical-align:middle}.eye[aria-pressed=false] .slash{display:none}.save{padding:12px;border:0;border-radius:12px;background:#634287;color:white;font-weight:700}a{color:#583778}
</style>
<main>
  <h1>重设拾词密码</h1>
  <p id="status" role="status">正在验证邮件链接…</p>
  <form hidden>
    <label for="password">新的拾词密码</label>
    <div class="field">
      <input id="password" type="password" minlength="6" required autocomplete="new-password">
      <button class="eye" type="button" aria-label="显示密码" aria-controls="password" aria-pressed="false">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/><path class="slash" d="m4 4 16 16"/></svg>
      </button>
    </div>
    <button type="submit" class="save">保存新密码</button>
  </form>
  <p><a href="./">返回拾词</a></p>
</main>
<script src="./supabase-client.js"></script>
<script>
(async () => {
  const status = document.querySelector('#status');
  const url = new URL(location.href);
  const params = new URLSearchParams(url.hash.slice(1));
  history.replaceState(null, '', url.pathname);
  const accessToken = params.get('access_token');
  const refreshToken = params.get('refresh_token');
  if (params.get('type') !== 'recovery' || !accessToken || !refreshToken) {
    status.textContent = '这次没有收到有效的邮件验证信息。请从 Gmail 打开最新邮件里的重置链接。';
    return;
  }
  if (!window.supabase) {
    status.textContent = '登录服务未能加载。请检查网络，再从邮件重新打开。';
    return;
  }
  const {auth} = window.supabase.createClient('https://jyqvqrvmniuhbupeyati.supabase.co','sb_publishable_uicWI8gT1qfXn010wh8XOA__9zq1jqK', {
    auth: {persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}
  });
  const {error, data} = await auth.setSession({access_token:accessToken,refresh_token:refreshToken});
  if (error || !data.session) {
    status.textContent = '邮件验证失败。请从拾词申请一封新的重置邮件。';
    return;
  }
  const form = document.querySelector('form');
  const password = document.querySelector('#password');
  const eye = document.querySelector('.eye');
  const save = document.querySelector('.save');
  status.textContent = '邮件验证成功。请输入至少 6 位的新密码。';
  form.hidden = false;

  function showPassword(visible) {
    password.type = visible ? 'text' : 'password';
    eye.setAttribute('aria-label', visible ? '隐藏密码' : '显示密码');
    eye.setAttribute('aria-pressed', String(visible));
  }
  eye.onclick = () => showPassword(password.type === 'password');
  form.onsubmit = async event => {
    event.preventDefault();
    showPassword(false);
    save.disabled = true;
    status.textContent = '正在保存新密码…';
    try {
      const result = await auth.updateUser({password:password.value});
      if (result.error) throw result.error;
      form.reset();
      form.hidden = true;
      status.textContent = '密码已更新。请回到 iPhone 原来的拾词图标，用新密码登录。';
    } catch (error) {
      status.textContent = error.code === 'same_password'
        ? '这个密码和旧密码相同，请换一个。'
        : '保存失败。请检查网络和密码是否符合要求后重试。';
    } finally {
      save.disabled = false;
    }
  };
})().catch(() => {
  document.querySelector('#status').textContent = '暂时无法验证。请检查网络，再从邮件重新打开。';
});
</script>
</html>
